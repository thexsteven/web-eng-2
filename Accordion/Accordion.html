<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion mit Vanilla JavaScript</title>
    <link rel="stylesheet" href="accordion.css" />
  </head>
  <body>
    <h1>Accordion</h1>

    <div class="accordion">
      <div class="accordion-item">
        <button class="accordion-header" aria-expanded="false">Was ist HTML?</button>
        <div class="accordion-content" hidden>
          <p>HTML beschreibt die Struktur und den Inhalt einer Webseite.</p>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" aria-expanded="false">Was ist CSS?</button>
        <div class="accordion-content" hidden>
          <p>CSS steuert das Aussehen der HTML-Elemente, z. B. Farben und Layout.</p>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" aria-expanded="false">Was ist JavaScript?</button>
        <div class="accordion-content" hidden>
          <p>JavaScript macht Webseiten interaktiv, z. B. durch DOM-Manipulation.</p>
        </div>
      </div>
    </div>

    <script src="accordion.js"></script>
  </body>
</html>
